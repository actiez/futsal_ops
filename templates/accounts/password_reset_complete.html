{% extends "base.html" %}

{% block title %}Password Updated{% endblock %}

{% block content %}
<div class="max-w-md mx-auto space-y-8">

    <!-- Page Header -->
    <div>
        <p class="text-sm font-bold text-emerald-600 uppercase tracking-wide">
            Account
        </p>
        <h1 class="mt-2 text-3xl font-black tracking-tight text-slate-950">
            Password Updated
        </h1>
        <p class="mt-2 text-slate-500">
            Your password has been reset. You can now log in with your new password.
        </p>
    </div>

    <div class="bg-white rounded-3xl border border-slate-100 shadow-sm p-6 md:p-8">
        <div class="rounded-3xl border border-emerald-100 bg-emerald-50 p-5">
            <div class="font-black text-emerald-900">
                You’re good to go
            </div>
            <p class="mt-2 text-sm text-emerald-800">
                Use your new password the next time you log in.
            </p>
        </div>

        <div class="mt-6">
            <a href="{% url 'login' %}"
               class="w-full inline-flex items-center justify-center px-5 py-3 rounded-full bg-emerald-600 text-white text-sm font-bold hover:bg-emerald-700">
                Login
            </a>
        </div>
    </div>

</div>
{% endblock %}
