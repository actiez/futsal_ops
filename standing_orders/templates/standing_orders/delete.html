{% extends "base.html" %}

{% block title %}Delete Standing Order{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">

    <div class="bg-white rounded-3xl border border-slate-100 shadow-sm p-8">
        <p class="text-sm font-bold text-red-600 uppercase tracking-wide">
            Delete Standing Order
        </p>

        <h1 class="mt-2 text-3xl font-black tracking-tight text-slate-950">
            {{ object.name }}
        </h1>

        <p class="mt-4 text-slate-600">
            Are you sure you want to delete this standing order? Existing events created by it will not be deleted.
        </p>

        <form method="post" class="mt-8 flex flex-wrap justify-end gap-3">
            {% csrf_token %}

            <a href="{% url 'standing_order_detail' object.id %}"
               class="inline-flex items-center justify-center px-5 py-3 rounded-full border border-slate-200 bg-white text-slate-700 text-sm font-bold hover:bg-slate-50">
                Cancel
            </a>

            <button type="submit"
                class="inline-flex items-center justify-center px-6 py-3 rounded-full bg-red-600 text-white text-sm font-bold hover:bg-red-700">
                Delete Standing Order
            </button>
        </form>
    </div>

</div>
{% endblock %}
